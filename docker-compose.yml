version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: inventory_db
    ports:
      - "27017:27117"
    volumes:
      - mongo_data:/data/db
    networks:
      - inventory_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/inventory
      - PORT=3000
    depends_on:
      - mongodb
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge

volumes:
  mongo_data:
